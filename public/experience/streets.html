<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Walk Down Our Street</title>
<meta name="description" content="A short interactive walk that shows what small habits do to a street.">
<meta property="og:title" content="A Walk Down Our Street">
<meta property="og:description" content="A short interactive walk that shows what small habits do to a street.">
<meta name="theme-color" content="#7fd0ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  --sky-top:#7fd0ff;--sky-bot:#eaf8ff;--sat:1.08;--water:#58c7ef;--leaf:#3fb35d;--grass:#7ccf6b;
  --sun:#ffd54a;--sunop:1;--cloud:#ffffff;--hill:#bfe6b3;--haze:0;
  --ink:#14202b;--paper:#fffdf8;--accent:#ff7a45;
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
  background:#10161c;display:flex;justify-content:center;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
body[data-level="1"]{--sky-top:#8ccaee;--sky-bot:#e4f1f6;--sat:1;--water:#55b8d8;--leaf:#3ea055;--grass:#78c068;--haze:.04}
body[data-level="2"]{--sky-top:#a9bdc8;--sky-bot:#dde0df;--sat:.8;--water:#6aa59c;--leaf:#6b9b46;--grass:#91ab5a;--cloud:#d7d9d8;--hill:#b2bf9a;--haze:.22;--sun:#f3d9a0;--sunop:.85}
body[data-level="3"]{--sky-top:#a49d8c;--sky-bot:#cbc2af;--sat:.62;--water:#7b7a4a;--leaf:#8c8a3d;--grass:#9a9650;--cloud:#b5ad9f;--hill:#a9a483;--haze:.42;--sun:#e0c78d;--sunop:.6}
body[data-level="4"]{--sky-top:#7c7367;--sky-bot:#ab9e8a;--sat:.4;--water:#5a4932;--leaf:#8a6a39;--grass:#837550;--cloud:#8f8578;--hill:#8d836b;--haze:.62;--sun:#c9b27c;--sunop:.4}

.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.app.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}}

/* top bar */
.topbar{position:absolute;z-index:10;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
.track{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.55);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .9s ease}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;background:rgba(20,32,43,.55);padding:4px 10px;border-radius:99px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}

/* stage */
.stage{position:relative;height:52%;flex:0 0 auto;overflow:hidden;background:#8ccaee}
.bg{position:absolute;inset:0;filter:saturate(var(--sat));transition:filter 1.4s}
.bg svg,.fg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fg{pointer-events:none}
.haze{position:absolute;inset:0;pointer-events:none;opacity:var(--haze);transition:opacity 1.4s;background:linear-gradient(to bottom,rgba(96,78,50,.95),rgba(96,78,50,.15) 75%)}

.sky-a{stop-color:var(--sky-top);transition:stop-color 1.4s}
.sky-b{stop-color:var(--sky-bot);transition:stop-color 1.4s}
.sun{fill:var(--sun);opacity:var(--sunop);transition:fill 1.4s,opacity 1.4s}
.halo{fill-opacity:.28}
.cloud{fill:var(--cloud);transition:fill 1.4s;animation:drift 16s ease-in-out infinite alternate}
.cloud.c2{animation-duration:22s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
.hill{fill:var(--hill);transition:fill 1.4s}
.leaf{fill:var(--leaf);transition:fill 1.4s}
.grass{fill:var(--grass);transition:fill 1.4s}
.water{fill:var(--water);transition:fill 1.4s}
.shim{animation:shim 6s linear infinite}
@keyframes shim{from{transform:translateX(0)}to{transform:translateX(480px)}}

/* walker */
#walker{transform:translate(86px,270px);transition:transform 1.1s cubic-bezier(.45,.05,.3,1)}
.bob,.leg{transform-box:fill-box}
.leg{transform-origin:50% 0}
#walker.moving .bob{animation:bob .38s ease-in-out infinite}
#walker.moving .legL{animation:stepL .38s ease-in-out infinite}
#walker.moving .legR{animation:stepR .38s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.6px)}}
@keyframes stepL{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
@keyframes stepR{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}

/* junk */
.junk .pop{opacity:0;transform:scale(.2);transition:opacity .5s,transform .6s cubic-bezier(.34,1.56,.64,1)}
.junk.on .pop{opacity:1;transform:scale(1)}
.junk.gone .pop{opacity:0;transform:scale(0) translateY(-14px);transition:opacity .35s,transform .4s}
.junk .hit{fill:rgba(0,0,0,0);pointer-events:none}
.junk.on .hit{pointer-events:all;cursor:pointer}
.junk .ring{fill:none;stroke:#ff7a45;stroke-width:2;opacity:0;pointer-events:none}
.junk.on .ring{animation:ring 1.8s ease-out infinite}
.junk.seen .ring{animation:none;opacity:0}
.junk:focus{outline:none}
.junk:focus-visible .ring{opacity:1;animation:none}
@keyframes ring{0%{transform:scale(.7);opacity:.95}100%{transform:scale(1.3);opacity:0}}

#flies{opacity:0;transition:opacity 1s}
body[data-level="3"] #flies,body[data-level="4"] #flies{opacity:1}
.fly{animation:fly 2.4s ease-in-out infinite}
.fly:nth-child(2n){animation-duration:1.9s;animation-delay:-.6s}
.fly:nth-child(3n){animation-duration:3.1s;animation-delay:-1.2s}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(8px,-6px)}50%{transform:translate(-4px,-11px)}75%{transform:translate(-9px,-2px)}}

.fact{position:absolute;left:12px;right:12px;bottom:34px;z-index:5;background:rgba(20,32,43,.92);color:#fff;font-size:14px;line-height:1.4;padding:10px 14px;border-radius:14px;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;pointer-events:none}
.fact.on{opacity:1;transform:none}

.spark{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:6;animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* panel */
.panel{position:relative;z-index:4;flex:1;min-height:0;margin-top:-24px;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.12);padding:22px 20px 0;overflow-y:auto;transition:opacity .22s,transform .22s}
.panel.swap{opacity:0;transform:translateY(8px)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:29px;line-height:1.12;margin-bottom:10px}
h1.final{font-size:32px;line-height:1.2;margin:6px 0 14px}
.lead{font-size:16px;line-height:1.5;color:#33424f;margin-bottom:14px}
.hint{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#5b6a76;margin-bottom:12px}
.hint::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.4}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pair div{border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.35}
.pair span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;opacity:.7}
.pair .cause{background:#fff0e6;color:#7a3414}
.pair .effect{background:#fde8e8;color:#7a1f1f}
.pair b{font-weight:700}
.meter{margin-bottom:14px}
.bar{height:10px;border-radius:10px;background:#e8e4da;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#43c067,#8fe36a);border-radius:10px;transition:width .4s}
#count{font-size:14px;font-weight:700}
.ctawrap{position:sticky;bottom:0;padding:12px 0 calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,253,248,0),var(--paper) 30%)}
.cta{width:100%;min-height:54px;border:0;border-radius:16px;font:700 17px 'DM Sans',system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#ff8a4c,#ff5f3d);box-shadow:0 8px 20px rgba(255,95,61,.35);cursor:pointer;transition:transform .12s,box-shadow .12s}
.cta:active{transform:scale(.98)}
.cta.ghost{background:#14202b;box-shadow:none}
.cta:focus-visible{outline:3px solid #14202b;outline-offset:3px}

/* twist overlay */
.twist{position:absolute;inset:0;z-index:20;background:rgba(10,13,16,.96);display:flex;align-items:center;padding:32px 28px;opacity:0;pointer-events:none;transition:opacity .8s;overflow-y:auto}
.twist.on{opacity:1;pointer-events:auto}
.twist-inner{width:100%;margin:auto 0}
.twist p{font-family:'Fraunces',Georgia,serif;font-size:22px;line-height:1.35;color:#f3efe6;margin-bottom:18px;opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s}
.twist p.big{font-size:46px;font-weight:800}
.twist p.in{opacity:1;transform:none}
.twist b{color:#ff8a4c}
.twist .cta{opacity:0;transition:opacity .9s}
.twist .cta.in{opacity:1}

.conf{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}


/* story */
.story{position:absolute;inset:0;z-index:25;overflow-y:auto;background:#10161c;color:#f3efe6;opacity:0;pointer-events:none;transition:opacity 1.1s;scroll-behavior:smooth}
.story.on{opacity:1;pointer-events:auto}
.s-wrap{padding:calc(40px + env(safe-area-inset-top)) 20px 8px}
.story h2{font-family:'Fraunces',Georgia,serif;font-weight:800;font-size:30px;line-height:1.15;margin-bottom:10px}
.story .lead2{font-size:16px;line-height:1.5;color:#c9d3da;margin-bottom:22px}
.story .kicker{margin-top:34px}
.cue{margin:6px 0 24px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#ff8a4c;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(6px)}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s}
.rv.in{opacity:1;transform:none}
.scene{border-radius:18px;overflow:hidden;background:#1a232c;margin-bottom:18px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.scene svg,.scene img{display:block;width:100%;height:auto}
.scene div{padding:12px 16px 16px}
.scene b{display:block;font-family:'Fraunces',Georgia,serif;font-size:19px;margin-bottom:3px}
.scene span{font-size:14.5px;line-height:1.45;color:#c9d3da}
.cons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.con{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px}
.con i{font-style:normal;font-size:28px;display:block;margin-bottom:6px}
.con b{display:block;font-size:15px;margin-bottom:4px;color:#ffb98f}
.con span{font-size:13px;line-height:1.4;color:#c9d3da}
.dawn{height:150px;background:linear-gradient(#10161c,#7a4a2e 55%,#fff4d6)}
.final{background:#fff4d6;color:#14202b;padding:10px 24px calc(48px + env(safe-area-inset-bottom));text-align:center;min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.final .kicker{margin-top:0}
.final h2.msg{font-size:40px;line-height:1.15;margin:8px 0 26px}
.final .cta{max-width:320px;margin-bottom:10px}
.stats{position:absolute;z-index:40;right:8px;bottom:6px;font-size:11px;font-weight:700;background:rgba(20,32,43,.85);color:#fff;padding:3px 9px;border-radius:99px;pointer-events:none}

@media (max-height:700px){
  .stage{height:44%}
  h1{font-size:24px}
  h1.final{font-size:27px}
  .lead{font-size:15px;margin-bottom:10px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .junk .ring{animation:none!important}
}
</style>
</head>

<script>
(() => {
'use strict';

/* ================= EDIT THESE ================= */
const FINAL_MESSAGE = "Clean surroundings begin with you.";   // <- your final message
const PROJECT_TAG   = "SBM · Awareness Project";              // <- small label, top right
const COUNTER_URL   = "https://script.google.com/macros/s/AKfycbxIHEIAlSRM7XSbkz2v77aDV17vtljHz5Le3QgOgScow5oRx8Qf3dFJEb6WWQhBP-O7Qg/exec";
const PHOTOS        = ["", "", "", ""];   // <- optional: "img/beach.jpg", "img/river.jpg", "img/hill.jpg", "img/market.jpg"
/* ============================================== */

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const body = document.body, app = $('#app'), stage = $('#stage'), fg = $('#fg'), walker = $('#walker');
const panel = $('#panel'), kicker = $('#kicker'), title = $('#title'), lead = $('#lead'), hintEl = $('#hint');
const pair = $('#pair'), causeEl = $('#cause'), effectEl = $('#effect'), meter = $('#meter');
const barFill = $('#barFill'), count = $('#count'), ctawrap = $('#ctawrap'), cta = $('#cta');
const fact = $('#fact'), twist = $('#twist'), twistInner = $('#twistInner'), prog = $('#prog');
$('#tag').textContent = PROJECT_TAG;

/* ---------- little town in the background ---------- */
(function town(){
  const g = $('#town');
  const pal = [['#f6c6a3','#d9694b'],['#bfe0f2','#4a7fb0'],['#f7e3a1','#c9573e'],['#d8c7f0','#7a58b0'],['#bfe8c9','#3f8f6a']];
  const W = [74,68,80,72,78], H = [54,68,48,60,52];
  let x = 4, html = '';
  pal.forEach((p,i) => {
    const w = W[i], h = H[i], top = 244 - h;
    html += `<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${p[0]}"/>`
          + `<path d="M${x-5} ${top} L${x+w/2} ${top-26} L${x+w+5} ${top}Z" fill="${p[1]}"/>`
          + `<rect x="${x+10}" y="${top+10}" width="13" height="13" rx="2" fill="#fff4b8"/>`
          + `<rect x="${x+w-23}" y="${top+10}" width="13" height="13" rx="2" fill="#fff4b8"/>`
          + `<rect x="${x+w/2-7}" y="220" width="14" height="24" rx="2" fill="#8a5a3b"/>`;
    x += w + 5;
  });
  g.innerHTML = html;
})();

/* ---------- litter shapes (drawn around 0,0) ---------- */
const SHAPES = {
  wrapper: c => `<path d="M-10 -4L-4 -8L3 -6L10 -2L7 5L-1 7L-9 4Z" fill="${c||'#ff7a45'}"/><path d="M-4 -6L-2 5M2 -5L3 6" stroke="#fff" stroke-opacity=".6" stroke-width="1.4" fill="none"/>`,
  bottle:  () => `<g transform="rotate(72)"><rect x="-4.5" y="-11" width="9" height="22" rx="3.5" fill="#a8dcec" stroke="#5aa5bd"/><rect x="-3" y="-15" width="6" height="5" rx="1.5" fill="#2a7fa0"/><rect x="-4.5" y="-3" width="9" height="6" fill="#fff" opacity=".7"/></g>`,
  cup:     () => `<path d="M-8 -7L8 -7L5.5 8L-5.5 8Z" fill="#f4f0e6" stroke="#c9b99a"/><rect x="-7" y="-3" width="14" height="4" fill="#d9503f"/>`,

  puddle:  () => `<ellipse cx="0" cy="0" rx="46" ry="9" fill="#5b4d2f" opacity=".88"/><ellipse cx="-8" cy="-1" rx="22" ry="4" fill="#7b6a3c" opacity=".7"/><circle cx="14" cy="-2" r="2" fill="#a3925a"/><circle cx="-20" cy="1" r="1.6" fill="#a3925a"/>`
};

/* L = the street level at which the item first appears */
const JUNK = [
  {id:'puddle', t:'puddle',  x:238, y:326, L:3, r:34, label:'Sewage overflow', fact:'Sewage mixing with street water can spread cholera, typhoid and stomach infections.'},
  {id:'w1',     t:'wrapper', x:150, y:286, L:1, c:'#ff7a45', label:'Wrapper', fact:'One wrapper looks harmless. Plastic can stay on the ground for hundreds of years.'},
  {id:'b1',     t:'bottle',  x:262, y:372, L:1, label:'Bottle', fact:'Bottles roll into drains. Drains lead to rivers.'},
  {id:'cup',    t:'cup',     x:296, y:286, L:2, label:'Paper cup', fact:'Wind, wheels and rain carry litter far from where it was dropped.'},
  {id:'chips',  t:'wrapper', x:196, y:396, L:2, c:'#f2c230', label:'Food wrapper', fact:'Food wrappers attract rats, flies and stray animals.'},
  {id:'bag1',   t:'bag',     x:96,  y:346, L:2, label:'Plastic bag', fact:'Stray animals swallow plastic bags. It can seriously harm them.'},
  {id:'heap1',  t:'heap',    x:74,  y:286, L:2, s:.9, r:30, label:'Waste pile', fact:'Mixed waste is hard to recycle. Wet and dry waste belong in separate bins.'},
  {id:'top',    t:'heap',    x:36,  y:250, L:2, s:.55, r:20, label:'Overflowing bin', fact:'An overflowing bin means waste is not being collected or sorted on time.'},
  {id:'clog',   t:'clog',    x:200, y:306, L:3, label:'Clogged drain', fact:'A clogged drain cannot carry rain away. The street floods.'},
  {id:'bag2',   t:'bag',     x:300, y:336, L:3, label:'Plastic bag', fact:'Plastic bags often block drains.'},
  {id:'b2',     t:'bottle',  x:58,  y:392, L:3, label:'Bottle', fact:'Water collecting in bottles and cans becomes a mosquito nursery.'},
  {id:'heap2',  t:'heap',    x:362, y:296, L:4, r:30, label:'Waste pile', fact:'Waste left to rot draws disease-carrying pests and smells for days.'},
  {id:'heap3',  t:'heap',    x:150, y:336, L:4, s:.8, r:28, label:'Waste pile', fact:'Every pile began as one piece that somebody thought did not matter.'}
];

const items = JUNK.map(j => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'junk');
  g.setAttribute('transform', `translate(${j.x} ${j.y})`);
  g.setAttribute('role', 'button');
  g.setAttribute('tabindex', '-1');
  g.setAttribute('aria-label', j.label);
  g.dataset.id = j.id;
  const sc = j.s ? `<g transform="scale(${j.s})">${SHAPES[j.t](j.c)}</g>` : SHAPES[j.t](j.c);
  g.innerHTML = `<g class="pop">${sc}</g><circle class="ring" r="${j.r||20}"/><circle class="hit" r="${(j.r||20)+3}"/>`;
  fg.appendChild(g);
  return Object.assign({}, j, {el: g, shown: false, removed: false});
});
const total = items.length;  // number of items on the street

/* ---------- story ---------- */
const chapters = [
  {level:0, kicker:'A normal morning', title:'Nice street, isn’t it?', lead:'Sunny. Quiet. Clean. Come, take a short walk with us.', cta:'Start walking'},
  {level:1, kicker:'Step 1', title:'Just one wrapper', lead:'Someone drops it without a thought. “It’s only one,” they say. Nobody stops them.', cause:'Poor civic sense', effect:'The next person copies what they see', hint:true, cta:'Keep walking'},
  {level:2, kicker:'Step 2', title:'Then everyone does', lead:'Bins overflow. Waste is never separated. It just piles up.', cause:'No sorting, no responsibility', effect:'Smell, pests and animals eating plastic', hint:true, cta:'Keep walking'},
  {level:3, kicker:'Step 3', title:'Then it goes underground', lead:'Plastic and waste choke the drains. Dirty water has nowhere to go.', cause:'Clogged drains, poor sewage', effect:'Waterlogging, mosquitoes, dengue, cholera', hint:true, cta:'Keep walking'},
  {level:4, kicker:'Step 4', title:'The street fights back', lead:'Children walk through this. Families breathe this. Everyone pays.', cause:'Years of small neglect', effect:'Sickness, lost days, polluted rivers', hint:true, cta:'Keep walking'}
];
const WX = [86, 150, 214, 278, 342];

let step = 0, phase = 'walk', cleaned = 0, busy = false, hinted = false;
let factTimer, walkTimer;

function setLevel(l){ body.dataset.level = l; }
function progress(f){ prog.style.width = Math.round(f * 100) + '%'; }

function setPanel(o){
  panel.classList.add('swap');
  setTimeout(() => {
    kicker.textContent = o.kicker || '';
    title.textContent = o.title || '';
    title.classList.toggle('final', !!o.final);
    lead.textContent = o.lead || ''; lead.hidden = !o.lead;
    pair.hidden = !o.cause;
    if (o.cause){ causeEl.textContent = o.cause; effectEl.textContent = o.effect; }
    hintEl.hidden = !o.hint || hinted;
    meter.hidden = !o.meter;
    ctawrap.hidden = !o.cta;
    if (o.cta){ cta.textContent = o.cta; cta.className = 'cta' + (o.ghost ? ' ghost' : ''); }
    panel.classList.remove('swap');
    panel.scrollTop = 0;
  }, 220);
}

function showItems(level){
  let k = 0;
  items.forEach(it => {
    if (!it.removed && !it.shown && it.L <= level){
      it.shown = true;
      it.el.firstChild.style.transitionDelay = (k++ * 0.14) + 's';
      it.el.classList.add('on');
      it.el.setAttribute('tabindex', '0');
    }
  });
}

function moveWalker(i){
  walker.classList.add('moving');
  walker.style.transform = `translate(${WX[Math.min(i, 4)]}px,270px)`;
  clearTimeout(walkTimer);
  walkTimer = setTimeout(() => walker.classList.remove('moving'), 1150);
}

function hideFact(){ clearTimeout(factTimer); fact.classList.remove('on'); }
function showFact(t){
  fact.textContent = t; fact.classList.add('on');
  clearTimeout(factTimer);
  factTimer = setTimeout(() => fact.classList.remove('on'), 4500);
}

function walk(i){
  step = i;
  const c = chapters[i];
  setLevel(c.level); showItems(c.level); moveWalker(i); hideFact();
  setPanel(c); progress(i / 7);
}

/* ---------- the surprise ---------- */
function startTwist(){
  phase = 'twist';
  hideFact();
  progress(5 / 7);
  app.classList.add('shake'); setTimeout(() => app.classList.remove('shake'), 500);
  twist.classList.add('on');
  const lines = [
    {t:'Wait.', cls:'big'},
    {t:'Did you notice?'},
    {t:'Every time you tapped <b>“Keep walking”</b>, the street got worse.'},
    {t:`You walked past <b>${total} things</b> that didn’t belong here. You didn’t pick up a single one.`},
    {t:'That is how a dirty street is made. Not by one big act, but by many people walking on.'}
  ];
  twistInner.innerHTML = '';
  lines.forEach((l, i) => {
    const p = document.createElement('p');
    if (l.cls) p.className = l.cls;
    p.innerHTML = l.t;
    twistInner.appendChild(p);
    setTimeout(() => p.classList.add('in'), 600 + i * 1500);
  });
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'cta'; b.textContent = 'Where does this lead?';
  twistInner.appendChild(b);
  setTimeout(() => b.classList.add('in'), 600 + lines.length * 1500);
  b.addEventListener('click', startStory);
}


/* ---------- counter (Google Sheet via Apps Script; off while COUNTER_URL is empty) ---------- */
const sent = {};
function vid(){
  try{ let v = localStorage.getItem('sbm_vid'); if (!v){ v = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('sbm_vid', v); } return v; }
  catch(e){ return 'na'; }
}
function log(kind){
  if (kind === 'finish'){ if (sent.finish) return; sent.finish = true; }
  if (!COUNTER_URL) return;
  const body = JSON.stringify({page: 'streets', event: kind, vid: vid()});
  try{ if (!(navigator.sendBeacon && navigator.sendBeacon(COUNTER_URL, body))) fetch(COUNTER_URL, {method:'POST', mode:'no-cors', body}); }catch(e){}
}

/* ---------- the scroll story ---------- */
const story = $('#story');
const P = (k,x,y,sc,c) => `<g transform="translate(${x} ${y}) scale(${sc||1})">${SHAPES[k](c)}</g>`;
const SCENES = [
  {t:'The beach', d:'Footprints and plastic, side by side. The tide carries it out, then brings it back.', sky:'#b8cdd2',
   bg:'<rect y="105" width="400" height="55" fill="#6d8f8c"/><path d="M0 112Q50 102 100 112T200 112T300 112T400 112V120H0Z" fill="#fff" opacity=".4"/><rect y="150" width="400" height="70" fill="#d9c08a"/><path d="M290 150V96" stroke="#7a5636" stroke-width="3"/><path d="M260 98Q290 66 320 98Z" fill="#e5604a"/>',
   j:[P('bottle',60,185,1.4),P('bag',150,172,1.6),P('cup',235,196,1.4),P('wrapper',330,184,1.3,'#f2c230'),P('heap',372,168,.8),P('wrapper',110,205,1.2)]},
  {t:'The river', d:'What starts on the bank ends in the water. Everything downstream drinks it.', sky:'#c9c6ae',
   bg:'<path d="M0 95Q80 60 160 90T320 80T400 92V130H0Z" fill="#a9b08c"/><rect y="118" width="400" height="62" fill="#6b6340"/><path d="M0 130Q60 124 120 130T240 130T400 130" stroke="#8a8052" stroke-width="2" fill="none"/><rect y="176" width="400" height="44" fill="#8a9358"/>',
   j:[P('bag',80,140,1.5),P('bottle',170,150,1.3),P('bag',335,138,1.4),P('clog',225,178,1.4),P('heap',60,196,1.1),P('heap',330,200,1)]},
  {t:'The hill viewpoint', d:'People climb for the view, and leave their snacks behind.', sky:'#c7cdd2',
   bg:'<path d="M0 130L70 60L130 110L200 40L280 115L340 70L400 120V160H0Z" fill="#9eaab0"/><path d="M0 150L90 100L170 140L260 95L400 145V170H0Z" fill="#8a9a88"/><rect y="165" width="400" height="55" fill="#9a8f78"/><path d="M0 160H400M30 160V190M110 160V190M190 160V190M270 160V190M350 160V190" stroke="#5c4a36" stroke-width="3"/>',
   j:[P('cup',60,200,1.4),P('wrapper',135,206,1.3),P('heap',235,198,1.3),P('bag',320,196,1.6),P('bottle',185,210,1.2)]},
  {t:'The market lane', d:'Where the crowd is biggest, the drains work hardest, and fail first.', sky:'#cfc7b5',
   bg:'<rect x="0" y="60" width="130" height="110" fill="#c98f6a"/><rect x="140" y="80" width="120" height="90" fill="#b9a56c"/><rect x="270" y="55" width="130" height="115" fill="#8f9fb3"/><path d="M0 60H130L118 80H12Z M270 55H400L388 75H282Z" fill="#c4553d"/><rect y="170" width="400" height="50" fill="#6a6d72"/><path d="M0 205H400" stroke="#e8d27a" stroke-width="3" stroke-dasharray="20 14"/>',
   j:[P('puddle',200,192,1.1),P('heap',65,186,1.1),P('bag',320,186,1.5),P('clog',150,176,1.2),P('wrapper',260,212,1.3,'#ff7a45'),P('bottle',370,205,1.2)]}
];
const COSTS = [
  ['🦠','Disease','Cholera, typhoid, dengue and stomach infections spread where waste and dirty water collect.'],
  ['🌊','Floods','Clogged drains cannot carry rain away, so streets and homes go under.'],
  ['🐟','Dying water','Plastic and sewage flow downstream into rivers and seas.'],
  ['🐄','Harmed animals','Animals swallow plastic and fall ill. Pests multiply around rotting waste.'],
  ['🧳','Lost visitors','Tourists avoid dirty places. Shops, guides and boatmen lose income.'],
  ['🧒','Children pay first','Sick days, missed school and streets too unsafe to play on.']
];
story.innerHTML = `<div class="s-wrap">
  <p class="kicker rv">The bigger picture</p>
  <h2 class="rv">It isn’t only our street.</h2>
  <p class="lead2 rv">The same small habits show up in the places people travel to see.</p>
  <div class="cue rv">Keep scrolling ↓</div>
  ${SCENES.map((c, i) => `<div class="scene rv">${PHOTOS[i] ? `<img src="${PHOTOS[i]}" alt="${c.t}" loading="lazy">` : `<svg viewBox="0 0 400 220" role="img" aria-label="Illustration: ${c.t}, littered"><rect width="400" height="220" fill="${c.sky}"/>${c.bg}${c.j.join('')}</svg>`}<div><b>${c.t}</b><span>${c.d}</span></div></div>`).join('')}
  <p class="kicker rv">What it costs</p>
  <h2 class="rv">Everyone pays.</h2>
  <div class="cons">${COSTS.map(c => `<div class="con rv"><i>${c[0]}</i><b>${c[1]}</b><span>${c[2]}</span></div>`).join('')}</div>
</div>
<div class="dawn"></div>
<section class="final">
  <p class="kicker rv">One last thing</p>
  <h2 class="msg rv" id="msg">${FINAL_MESSAGE}</h2>
  <button class="cta rv" id="againBtn" type="button">Run it again</button>
  <button class="cta ghost rv" id="shareBtn" type="button">Share</button>
  <a class="cta ghost rv" id="reportBtn" href="https://swachhseva-nine.vercel.app" target="_blank" rel="noopener" style="display:block;text-decoration:none;text-align:center;padding:16px 12px">Report a problem on SwachhSeva</a>
  <p class="rv" style="font-size:13px;color:#52616d;margin-top:8px">Try another: <a href="rivers.html">Rivers</a> · <a href="nature.html">Nature</a></p>
</section>`;

const obs = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in'); obs.unobserve(e.target);
  if (e.target.id === 'msg') log('finish');
}), {root: story, threshold: .25});

function startStory(){
  phase = 'story';
  progress(6 / 7);
  story.classList.add('on'); story.scrollTop = 0;
  setTimeout(() => twist.classList.remove('on'), 1000);
  story.querySelectorAll('.rv').forEach(el => { el.classList.remove('in'); obs.observe(el); });
}

function onJunk(it){
  if (!it || !it.shown || phase !== 'walk') return;
  it.el.classList.add('seen');
  hinted = true; hintEl.hidden = true;
  showFact(it.fact);
}

function replay(){
  story.classList.remove('on'); twist.classList.remove('on');
  items.forEach(it => {
    it.removed = false; it.shown = false;
    it.el.classList.remove('on','gone','seen');
    it.el.firstChild.style.transitionDelay = '';
    it.el.setAttribute('tabindex', '-1');
  });
  hinted = false; phase = 'walk';
  walk(0);
}

story.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('#reportBtn')) log('report');
  const t = e.target.closest && e.target.closest('button'); if (!t) return;
  if (t.id === 'againBtn'){ log('replay'); replay(); }
  if (t.id === 'shareBtn'){
    log('share');
    const data = {title: document.title, text: FINAL_MESSAGE, url: location.href};
    if (navigator.share) navigator.share(data).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(() => { t.textContent = 'Link copied'; }).catch(() => {});
  }
});

/* ---------- events ---------- */
cta.addEventListener('click', () => {
  if (busy) return;
  busy = true; setTimeout(() => { busy = false; }, 900);
  if (phase === 'walk'){ if (step === 0) log('start'); if (step < 4) walk(step + 1); else startTwist(); }
  
});

function itemFrom(e){
  const g = e.target.closest && e.target.closest('.junk');
  return g ? items.find(it => it.el === g) : null;
}
fg.addEventListener('click', e => onJunk(itemFrom(e)));
fg.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onJunk(itemFrom(e)); }
});

walk(0);
})();
</script>
