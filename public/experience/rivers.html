<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The journey of a drop · SwachhSeva</title>
<meta name="description" content="Follow one drop from a hill spring to the sea, and see what a river carries along the way.">
<meta name="theme-color" content="#b9e8ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{--sky1:#9be1ed;--sky2:#e3f6e9;--water:#35b9cb;--water2:#168fae;--bank:#77bd79;--hill:#9acb91;--accent:#f2b84b;--ink:#123b43;--paper:#f8fffb;--muted:#55747a;font:16px 'DM Sans',system-ui,sans-serif;color:var(--ink);background:#d7f0ec;display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
body[data-level="1"]{--sky1:#a7dce8;--sky2:#e4f1df;--water:#2daabd;--water2:#147f9e;--bank:#83b978;--hill:#a0c48c}
body[data-level="2"]{--sky1:#b8d8d9;--sky2:#e9e6ce;--water:#359fa7;--water2:#277c8a;--bank:#a0ad72;--hill:#b0b68b}
body[data-level="3"]{--sky1:#c7d1cb;--sky2:#e8ddc6;--water:#648f86;--water2:#426f70;--bank:#a69c69;--hill:#b1a77f}
body[data-level="4"]{--sky1:#b9c4c0;--sky2:#ddd5c3;--water:#687d70;--water2:#485f59;--bank:#9b8b62;--hill:#a29578}
.app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);box-shadow:0 0 50px #28616a20}
.topbar{position:absolute;z-index:10;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;gap:10px;align-items:center}
.track{height:5px;flex:1;border-radius:9px;background:#ffffffa8;overflow:hidden;box-shadow:0 1px 5px #24616a22}
.track i{display:block;width:0;height:100%;border-radius:9px;background:var(--accent);transition:width .8s ease}
.tag{font-size:10px;letter-spacing:.08em;font-weight:700;color:#164750;background:#f5fffae8;padding:6px 10px;border-radius:99px}
.stage{height:49%;min-height:260px;flex:0 0 auto;position:relative;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));transition:background 1.4s}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sky{stop-color:var(--sky1);transition:stop-color 1.4s}.sky-end{stop-color:var(--sky2);transition:stop-color 1.4s}
.hill{fill:var(--hill);transition:fill 1.4s}.bank{fill:var(--bank);transition:fill 1.4s}
.water{fill:var(--water);transition:fill 1.4s}.water-deep{fill:var(--water2);transition:fill 1.4s}
.sun{transform-origin:405px 67px;animation:sunpulse 5s ease-in-out infinite}
@keyframes sunpulse{50%{transform:scale(1.08);opacity:.78}}
.cloud{animation:cloudmove 23s ease-in-out infinite alternate}
.cloud.c2{animation-duration:31s;animation-direction:alternate-reverse}
@keyframes cloudmove{to{transform:translateX(28px)}}
.ripple{animation:ripple 5s linear infinite}
.ripple.r2{animation-delay:-2.5s}
@keyframes ripple{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.sparkle{animation:twinkle 2.2s ease-in-out infinite}
.sparkle:nth-child(2n){animation-delay:-1s}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}
.bird{animation:birdfly 7s ease-in-out infinite alternate}
@keyframes birdfly{to{transform:translate(30px,-12px)}}
.fish{transition:opacity .8s,transform .8s;transform-origin:center}
body[data-level="3"] .fish,body[data-level="4"] .fish{opacity:0;transform:translateY(12px)}
.walker{transition:transform 1s cubic-bezier(.4,0,.2,1)}
.walker .body{transform-origin:center;animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.walker.moving .leg-a{animation:legs .24s ease-in-out infinite alternate;transform-origin:top}
.walker.moving .leg-b{animation:legs .24s ease-in-out infinite alternate-reverse;transform-origin:top}
@keyframes legs{to{transform:rotate(22deg)}}
.litter{opacity:0;transform:scale(.15);transform-box:fill-box;transform-origin:center;transition:opacity .45s,transform .65s cubic-bezier(.2,1.5,.5,1);cursor:pointer}
.litter.on{opacity:1;transform:scale(1)}
.litter .pulse{fill:none;stroke:#fff9d8;stroke-width:2;opacity:0}
.litter.on .pulse{animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.65);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.litter:focus{outline:none;filter:drop-shadow(0 0 5px #fff)}
.haze{opacity:0;transition:opacity 1.5s;pointer-events:none}
body[data-level="2"] .haze{opacity:.08}body[data-level="3"] .haze{opacity:.19}body[data-level="4"] .haze{opacity:.28}
.fact{position:absolute;z-index:6;left:14px;right:14px;bottom:12px;padding:11px 14px;border-radius:14px;background:#103f49ed;color:#f4fffa;font-size:13px;line-height:1.4;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.fact.on{opacity:1;transform:none}
.panel{position:relative;z-index:3;flex:1;min-height:0;margin-top:-21px;border-radius:24px 24px 0 0;background:var(--paper);box-shadow:0 -8px 26px #174d4a18;padding:20px 21px 0;overflow-y:auto;transition:opacity .22s,transform .22s}
.panel.swap{opacity:0;transform:translateY(9px)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#178c91;margin-bottom:6px}
h1,h2{font-family:Fraunces,Georgia,serif;line-height:1.1}
h1{font-size:29px;margin-bottom:9px;color:#123b43}
.lead{font-size:15px;line-height:1.5;color:#4a6970;margin-bottom:12px}
.hint{font-size:12px;color:#628087;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.hint:before{content:"";width:8px;height:8px;border-radius:50%;background:#e9ae3c;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.35}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.pair div{padding:9px 11px;border-radius:12px;font-size:12px;line-height:1.35}
.pair span{display:block;font-size:9px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.cause{background:#e6f4e9;color:#245b43}.effect{background:#fff0d8;color:#80551b}
.ctawrap{position:sticky;bottom:0;padding:10px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#f8fffb00,var(--paper) 30%)}
button,.action{width:100%;min-height:52px;border:0;border-radius:15px;padding:13px 16px;background:linear-gradient(135deg,#168f91,#08717e);color:white;font:700 16px 'DM Sans',sans-serif;text-align:center;text-decoration:none;display:block;cursor:pointer;box-shadow:0 7px 18px #168f9138}
button:active{transform:scale(.985)}button.secondary,.action.secondary{background:#123f48;box-shadow:none}
button:focus-visible,a:focus-visible{outline:3px solid #e6ad3e;outline-offset:3px}
.twist{position:absolute;inset:0;z-index:20;background:linear-gradient(145deg,#0b555e,#123c49 72%,#176c70);color:#f3fff7;display:flex;align-items:center;padding:34px 27px;opacity:0;pointer-events:none;transition:opacity .8s;overflow-y:auto}
.twist.on{opacity:1;pointer-events:auto}.twist-inner{width:100%;margin:auto}
.twist .kicker{color:#f5c65b}.twist p{font:600 23px/1.35 Fraunces,Georgia,serif;margin:0 0 17px;opacity:0;transform:translateY(14px);transition:opacity .9s,transform .9s}
.twist p.big{font-size:48px}.twist p.in{opacity:1;transform:none}.twist b{color:#f5c65b}
.twist button{margin-top:12px;opacity:0;transition:opacity .8s}.twist button.in{opacity:1}
.story{position:absolute;inset:0;z-index:25;overflow-y:auto;background:#0d424b;color:#effbf4;opacity:0;pointer-events:none;transition:opacity 1s;scroll-behavior:smooth}
.story.on{opacity:1;pointer-events:auto}
.s-wrap{padding:calc(42px + env(safe-area-inset-top)) 20px 22px}
.story .kicker{color:#f4c35c;margin-top:30px}
.story h2{font-size:32px;margin:8px 0 10px;color:#f5fff8}
.story .lead2{color:#c8e1dc;line-height:1.55;margin-bottom:18px}
.cue{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f5c65b;font-weight:700;margin:20px 0 24px;animation:nudge 1.6s infinite}
@keyframes nudge{50%{transform:translateY(6px)}}
.rv{opacity:0;transform:translateY(24px);transition:opacity .85s,transform .85s}.rv.in{opacity:1;transform:none}
.story-scene{margin:0 0 16px;border-radius:18px;overflow:hidden;background:#1b6267;box-shadow:0 12px 30px #062e353f}
.story-scene svg{display:block;width:100%;height:auto}
.story-scene div{padding:12px 15px 15px}.story-scene b{display:block;font:700 19px Fraunces,Georgia,serif;margin-bottom:4px;color:#f6ce77}.story-scene span{font-size:13px;line-height:1.5;color:#d0e6df}
.cons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 22px}
.con{border:1px solid #ffffff20;background:#ffffff0b;border-radius:15px;padding:13px}
.con i{font-style:normal;font-size:24px;display:block;margin-bottom:6px}.con b{display:block;color:#f6ce77;font-size:14px;margin-bottom:4px}.con span{font-size:12px;line-height:1.45;color:#d0e6df}
.dawn{height:125px;background:linear-gradient(#0d424b,#6c9e83 60%,#fff4d9)}
.final{background:#fff4d9;color:#123b43;min-height:70vh;padding:24px 23px calc(44px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.final .kicker{color:#178c91;margin:0}.final h2{font-size:39px;margin:12px 0 25px}.final button,.final .action{max-width:320px;margin:5px 0}
.final .small{font-size:12px;line-height:1.6;color:#55747a;margin-top:12px}.final a.inline{color:#08717e;font-weight:700}
@media(max-height:700px){.stage{height:43%;min-height:220px}h1{font-size:25px}.lead{font-size:14px;margin-bottom:8px}.panel{padding-top:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

 <div class="kicker" id="kicker">A journey begins</div>
 <h1 id="title">Where does a river's story begin?</h1>
 <p class="lead" id="lead">High in the hills, one clear drop starts moving. Follow it downstream and see what joins its journey.</p>
 <p class="hint" id="hint">Tap objects as they appear in the scene to learn more.</p>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const body=document.body,app=$('app'),panel=$('panel'),walker=$('walker');
const STEPS=[
 {k:'A journey begins',t:'The hill spring',d:'High in the hills, one clear drop starts moving. The water is clear, and the banks are full of life.',c:'A clean source',e:'A river begins to support everything downstream.'},
 {k:'Stop 2 · The village',t:'A bottle left behind',d:'The stream passes homes and fields. A bottle left near the bank is swept into the water by rain.',c:'Litter on the bank',e:'Rain carries it into the stream.'},
 {k:'Stop 3 · The market',t:'The river gets busier',d:'More people gather near the water. Wrappers and food packaging can slip from busy banks into the current.',c:'Waste near the ghat',e:'Light plastic travels with the current.'},
 {k:'Stop 4 · The city',t:'A drain meets the river',d:'Roads and drains connect to the river. Wastewater needs proper treatment before it reaches the water.',c:'Untreated discharge',e:'Water quality and habitats can be affected.'},
 {k:'Stop 5 · Downstream',t:'Nothing simply disappears',d:'The river keeps moving. Waste dropped far upstream can travel a long way from where it began.',c:'Pollution travels',e:'Downstream communities and wildlife are connected.'}
];
const COUNTER_URL='https://script.google.com/macros/s/AKfycbxIHEIAlSRM7XSbkz2v77aDV17vtljHz5Le3QgOgScow5oRx8Qf3dFJEb6WWQhBP-O7Qg/exec';
let step=0,started=false,finished=false,phase='journey',factTimer;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function log(event){try{let vid=localStorage.getItem('sbm_vid');if(!vid){vid=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('sbm_vid',vid)}const data=JSON.stringify({page:'rivers',event,vid});if(!navigator.sendBeacon(COUNTER_URL,data))fetch(COUNTER_URL,{method:'POST',mode:'no-cors',body:data})}catch(e){}}
function render(){
 const s=STEPS[step];body.dataset.level=String(step);
 $('kicker').textContent=s.k;$('title').textContent=s.t;$('lead').textContent=s.d;
 $('cause').textContent=s.c;$('effect').textContent=s.e;$('pair').hidden=step===0;
 $('hint').hidden=step===0;$('advance').textContent=step===0?'Follow the drop':step===4?'See where it leads':'Keep following';
 $('prog').style.width=((step+1)/7*100)+'%';
 document.querySelectorAll('.litter').forEach(el=>el.classList.toggle('on',Number(el.dataset.level)<=step));
 walker.classList.add('moving');walker.setAttribute('transform','translate('+([75,150,245,330,420][step])+' 350)');
 setTimeout(()=>walker.classList.remove('moving'),900);
}
function swapPanel(){panel.classList.add('swap');setTimeout(()=>{panel.classList.remove('swap');},220)}
function showFact(el){$('fact').textContent=el.dataset.fact;$('fact').classList.add('on');clearTimeout(factTimer);factTimer=setTimeout(()=>$('fact').classList.remove('on'),4200)}
document.querySelector('.stage').addEventListener('click',e=>{const el=e.target.closest('.litter');if(el&&el.classList.contains('on'))showFact(el)});
document.querySelector('.stage').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('litter')&&e.target.classList.contains('on')){e.preventDefault();showFact(e.target)}});
$('advance').addEventListener('click',()=>{
 if(phase!=='journey')return;
 if(!started){started=true;log('start')}
 if(step<4){step++;swapPanel();render()}else showTwist();
});
function showTwist(){
 phase='twist';if(!finished){finished=true;log('finish')}
 const twist=$('twist'),inner=$('twistInner');inner.innerHTML='';
 const lines=[{t:'Wait.',big:true},{t:'The river carried every stop with it.'},{t:'The bottle. The wrapper. The wastewater.'},{t:'They did not stay where they entered. A river connects every place along its course.'}];
 lines.forEach((line,i)=>{const p=document.createElement('p');if(line.big)p.className='big';p.textContent=line.t;inner.appendChild(p);setTimeout(()=>p.classList.add('in'),reduced()?0:450+i*1150)});
 const k=document.createElement('div');k.className='kicker';k.textContent='Look beyond the riverbank';inner.prepend(k);
 const b=document.createElement('button');b.textContent='What does this mean for us?';inner.appendChild(b);setTimeout(()=>b.classList.add('in'),reduced()?0:lines.length*1150+500);
 b.addEventListener('click',showStory);twist.classList.add('on');
}
function showStory(){
 phase='story';$('twist').classList.remove('on');const story=$('story');
 story.innerHTML=`<div class="s-wrap">
 <p class="kicker rv">The bigger picture</p><h2 class="rv">A river is part of everyone's life.</h2>
 <p class="lead2 rv">Its water, banks and ecosystems connect villages, cities, farms and wildlife. Pollution in one place can affect many others.</p>
